<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8e9" />
    <title>Little Match — Memory Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topline">
        <a class="brand" href="#" aria-label="Little Match home"><span class="brand-mark">✦</span> little match</a>
        <span class="top-note">A tiny brain break</span>
      </header>

      <section class="game-card" aria-labelledby="game-title">
        <div class="intro">
          <p class="eyebrow">READY, SET, REMEMBER</p>
          <h1 id="game-title">Find your <span>match!</span></h1>
          <p class="subtitle">Turn over two cards and find the matching pairs.</p>
        </div>

        <div class="scoreboard" aria-label="Game score">
          <div class="score-item"><span class="score-icon">↻</span><span class="score-label">TRIES</span><strong id="tries">0</strong></div>
          <div class="score-divider" aria-hidden="true"></div>
          <div class="score-item"><span class="score-icon heart">♥</span><span class="score-label">MATCHES</span><strong id="matches">0 <small>/ 6</small></strong></div>
          <button class="restart-button" id="restart" type="button"><span aria-hidden="true">⟳</span> Restart</button>
        </div>

        <div class="board" id="board" aria-label="Memory card grid">
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🍓</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🌈</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🐸</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🍋</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🐙</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🌼</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🌼</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🍓</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🐙</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🐸</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🍋</span></span></button>
          <button class="memory-card" type="button" aria-label="Hidden card"><span class="card-inner"><span class="card-face card-back">✦</span><span class="card-face card-front">🌈</span></span></button>
        </div>
        <p class="hint" id="status" role="status" aria-live="polite"><span aria-hidden="true">☀</span> Take your time — you’ve got this!</p>
      </section>
      <footer>Made for curious minds <span aria-hidden="true">♥</span></footer>
    </main>
  </body>
</html>
